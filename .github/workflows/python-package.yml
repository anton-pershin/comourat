name: Python package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest build black isort pylint mypy
      - name: Check formatting
        run: black --check comourat tests
      - name: Check import order
        run: isort --check-only comourat tests
      - name: Lint
        run: pylint comourat
      - name: Check types
        run: mypy comourat
      - name: Run tests
        run: python -m pytest -q
      - name: Build distributions
        run: python -m build
